name: Dev APK
on:
  push:
    branches: [build/dev-apk]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true
      - name: Apply patch
        shell: pwsh
        run: lib/scripts/patch.ps1 android
      - name: Build dev APK
        run: flutter build apk --release --split-per-abi --dart-define-from-file=pili_release.json --android-project-arg dev=1
      - uses: actions/upload-artifact@v4
        with:
          name: dev-apk-arm64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
